<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>City Builder</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a2e; }
      #app { display: flex; height: 100vh; width: 100vw; }
      #sidebar {
        width: 300px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #12121c;
        color: #eee;
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
        font-size: 13px;
      }
      #sidebar-resources {
        flex-shrink: 0;
        padding: 10px 12px 8px;
        border-bottom: 1px solid #2a2a3c;
      }
      .resource-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .resource {
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
      }
      .resource svg, .resource img {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .resource strong { font-variant-numeric: tabular-nums; }
      #sidebar-main {
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 12px;
      }
      #sidebar h2 {
        margin: 0 0 8px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #a0a0c0;
      }
      #sidebar-main section {
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid #2a2a3c;
      }
      #sidebar-main button:not(.build-tile) {
        display: block;
        width: 100%;
        margin: 4px 0;
        padding: 6px 8px;
        text-align: left;
        background: #1e1e32;
        color: #ffe066;
        border: 1px solid #3a3a55;
        border-radius: 4px;
        cursor: pointer;
        font: inherit;
      }
      #sidebar-main button:not(.build-tile):hover:not(:disabled) { background: #2a2a48; }
      #sidebar-main button:not(.build-tile):disabled {
        color: #777;
        cursor: default;
        border-color: #2a2a3c;
      }
      #sidebar [hidden] { display: none !important; }
      #sidebar-main button.active,
      #sidebar-actions button.active {
        outline: 1px solid #ffe066;
        background: #2a2a48;
      }
      .build-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        width: 100%;
        min-width: 0;
      }
      .build-tile {
        aspect-ratio: 1;
        width: 100%;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
        margin: 0;
        padding: 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        overflow: hidden;
        background: #1e1e32;
        color: #eee;
        border: 1px solid #3a3a55;
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
      }
      .build-tile:hover { background: #2a2a48; }
      .build-tile.active {
        outline: 1px solid #ffe066;
        background: #2a2a48;
      }
      .build-tile img {
        width: 100%;
        flex: 1;
        min-height: 0;
        object-fit: contain;
        image-rendering: pixelated;
      }
      .build-tile-label {
        font-size: 10px;
        line-height: 1.2;
        text-align: center;
        color: #c8c8e0;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        width: 100%;
        min-width: 0;
      }
      #sidebar-actions {
        flex-shrink: 0;
        display: flex;
        gap: 8px;
        padding: 8px 12px;
        border-top: 1px solid #2a2a3c;
        background: #12121c;
      }
      #sidebar-actions button {
        width: 40px;
        height: 40px;
        margin: 0;
        padding: 0;
        display: grid;
        place-items: center;
        background: #1e1e32;
        color: #ffe066;
        border: 1px solid #3a3a55;
        border-radius: 6px;
        cursor: pointer;
      }
      #sidebar-actions button:hover:not(:disabled) { background: #2a2a48; }
      #sidebar-actions button:disabled {
        color: #555;
        cursor: default;
      }
      #sidebar-actions button svg { width: 20px; height: 20px; }
      #sidebar .muted { color: #888; }
      #sidebar .status { color: #ff8888; min-height: 1.2em; margin-top: 4px; }
      #invent-prompt {
        width: 100%; box-sizing: border-box; margin: 6px 0;
        min-height: 64px; padding: 6px; resize: vertical;
        background: #1e1e32; color: #eee;
        border: 1px solid #3a3a55; border-radius: 4px; font: inherit;
      }
      #invent-sizes { margin: 4px 0 8px; }
      #invent-sizes label { margin-right: 12px; cursor: pointer; }
      #invent-submit {
        text-align: center;
        font-weight: 600;
        background: #3d3a1a;
      }
      #stage { flex: 1; position: relative; min-width: 0; }
      #phaser-root { position: absolute; inset: 0; }
      #zoom-controls {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 5;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #zoom-controls button {
        width: 36px;
        height: 36px;
        padding: 0;
        font: 20px/1 system-ui, sans-serif;
        color: #ffe066;
        background: #12121c;
        border: 1px solid #3a3a55;
        border-radius: 4px;
        cursor: pointer;
      }
      #zoom-controls button:hover:not(:disabled) { background: #2a2a48; }
      #zoom-controls button:disabled {
        color: #555;
        cursor: default;
      }
      /* Three mesh path disabled — Phaser 2.5D sprites only */
      #three-root { display: none; pointer-events: none; }
      #login {
        position: fixed; inset: 0; z-index: 30;
        display: flex; align-items: center; justify-content: center;
        background: #1a1a2e; color: #eee;
        font-family: system-ui, sans-serif;
      }
      #login[hidden] { display: none; }
      #login form {
        width: 280px; padding: 20px;
        background: #12121c; border: 1px solid #3a3a55; border-radius: 8px;
      }
      #login h1 { margin: 0 0 12px; font-size: 18px; }
      #login label { display: block; font-size: 13px; color: #a0a0c0; margin-bottom: 6px; }
      #login input {
        width: 100%; box-sizing: border-box; margin-bottom: 10px;
        padding: 8px; background: #1e1e32; color: #eee;
        border: 1px solid #3a3a55; border-radius: 4px; font: inherit;
      }
      #login button {
        width: 100%; padding: 8px; background: #2a2a48; color: #ffe066;
        border: 1px solid #3a3a55; border-radius: 4px; cursor: pointer; font: inherit;
      }
      #login .err { color: #ff8888; min-height: 1.2em; font-size: 13px; margin-top: 8px; }
      #login .hint { color: #888; font-size: 12px; margin: 0 0 12px; }
    </style>
  </head>
  <body>
    <div id="login">
      <form id="login-form">
        <h1>City Builder</h1>
        <p class="hint">Enter a name (2–24 letters, numbers, _ or -). No password — that name is your save.</p>
        <label for="player-name">Player name</label>
        <input id="player-name" name="name" required minlength="2" maxlength="24" autocomplete="username" />
        <button type="submit">Enter city</button>
        <div id="login-error" class="err" aria-live="polite"></div>
      </form>
    </div>
    <div id="app">
      <aside id="sidebar">
        <section id="sidebar-resources">
          <div id="resources-body"></div>
        </section>
        <div id="sidebar-main">
          <section id="sidebar-build" hidden>
            <h2>Build</h2>
            <div id="build-body" class="build-grid"></div>
            <button type="button" id="cancel-build" hidden>Cancel build</button>
          </section>
          <section id="sidebar-research" hidden>
            <h2>Research</h2>
            <div id="research-body"></div>
            <div id="invent-form">
              <h2>Invent <span id="invent-count" class="muted">(0/3)</span></h2>
              <div class="muted">Mô tả nhà (4–160 chữ). Creative brief cho PixelLab.</div>
              <textarea id="invent-prompt" maxlength="160" placeholder="cozy noodle stall with lanterns"></textarea>
              <div id="invent-sizes" class="muted">Kích thước: 3×3</div>
              <button type="button" id="invent-submit">Nghiên cứu &amp; tạo ảnh</button>
              <div id="invent-hint" class="muted"></div>
            </div>
          </section>
          <section id="sidebar-market" hidden>
            <h2>Market</h2>
            <div id="market-body" class="muted">Loading catalog…</div>
          </section>
          <section id="sidebar-selection">
            <h2>Selection</h2>
            <div id="selection-body" class="muted">Click a building on the map</div>
          </section>
          <section id="sidebar-meta" hidden>
            <button type="button" id="new-game">New game</button>
          </section>
          <div id="sidebar-status" class="status" aria-live="polite"></div>
        </div>
        <footer id="sidebar-actions">
          <button type="button" id="action-build" title="Build" aria-pressed="false" aria-label="Build">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 6l7 7-4 4-3-3v6H8v-8L3 7l4-4 7 3z" />
            </svg>
          </button>
          <button type="button" id="action-research" title="Research" aria-pressed="false" aria-label="Research">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="M20 20l-3.5-3.5" />
            </svg>
          </button>
          <button type="button" id="action-market" title="Market" aria-pressed="false" aria-label="Market">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 7h16l-1 12H5L4 7z" />
              <path d="M8 7V5a4 4 0 0 1 8 0v2" />
            </svg>
          </button>
        </footer>
      </aside>
      <div id="stage">
        <div id="phaser-root"></div>
        <canvas id="three-root"></canvas>
        <div id="zoom-controls">
          <button type="button" id="zoom-in" title="Zoom in (+)">+</button>
          <button type="button" id="zoom-out" title="Zoom out (−)">−</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
